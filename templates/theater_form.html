<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if edit_mode %}
        Edit Theater
        {% else %}
        Add Theater
        {% endif %}
    </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f2f2;
            color: #222;
            min-height: 100vh;
            transition: 0.3s;
        }

        body.dark {
            background: #181818;
            color: white;
        }

        .navbar {
            background: #4b0082;
            color: white;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .navbar h2 {
            margin-bottom: 10px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin: 5px;
            font-weight: bold;
        }

        .theme-buttons {
            margin-top: 10px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .light-btn {
            background: white;
            color: black;
        }

        .dark-btn {
            background: black;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 550px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 12px #aaa;
        }

        body.dark .container {
            background: #292929;
            box-shadow: 0 0 12px #000;
        }

        h1 {
            text-align: center;
            color: #4b0082;
            margin-bottom: 25px;
        }

        body.dark h1 {
            color: #d6a2ff;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 15px;
        }

        body.dark input {
            background: #444;
            color: white;
            border: 1px solid #777;
        }

        .submit-btn {
            width: 100%;
            margin-top: 25px;
            background: #4b0082;
            color: white;
            font-size: 16px;
        }

        .submit-btn:hover {
            background: #6a0dad;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #4b0082;
            text-decoration: none;
            font-weight: bold;
        }

        body.dark .back-btn {
            color: #d6a2ff;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div>
            <h2>Theater Management System</h2>

            <div class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('movies') }}">Movies</a>
                <a href="{{ url_for('theaters') }}">Theaters</a>
                <a href="{{ url_for('shows') }}">Shows</a>
            </div>
        </div>

        <div class="theme-buttons">

            <button class="light-btn" onclick="setLightTheme()">
                Light
            </button>

            <button class="dark-btn" onclick="setDarkTheme()">
                Dark
            </button>

        </div>

    </div>

    <div class="container">

        <h1>
            {% if edit_mode %}
            Edit Theater
            {% else %}
            Add Theater
            {% endif %}
        </h1>

        <form method="POST">

            <label for="name">Theater Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter theater name"
                value="{{ theater.name if theater else '' }}"
                required
            >

            <label for="location">Location</label>

            <input
                type="text"
                id="location"
                name="location"
                placeholder="Enter theater location"
                value="{{ theater.location if theater else '' }}"
                required
            >

            <label for="seats">Number of Seats</label>

            <input
                type="number"
                id="seats"
                name="seats"
                placeholder="Enter number of seats"
                value="{{ theater.seats if theater else '' }}"
                min="1"
                required
            >

            <button type="submit" class="submit-btn">

                {% if edit_mode %}
                Update Theater
                {% else %}
                Add Theater
                {% endif %}

            </button>

        </form>

        <a href="{{ url_for('theaters') }}" class="back-btn">
            Back to Theaters
        </a>

    </div>

    <script>

        function setLightTheme() {
            document.body.classList.remove("dark");
            localStorage.setItem("theme", "light");
        }

        function setDarkTheme() {
            document.body.classList.add("dark");
            localStorage.setItem("theme", "dark");
        }

        window.onload = function () {

            if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark");
            }

        };

    </script>

</body>

</html>
