<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Booking</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f9;

            color: #222;

            transition: 0.3s;
        }


        body.dark {

            background: #121212;

            color: white;
        }


        /* NAVBAR */

        nav {

            background: #222;

            padding: 15px;

            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }


        nav a {

            color: white;

            text-decoration: none;

            padding: 10px 15px;

            border-radius: 6px;
        }


        nav a:hover {

            background: #444;
        }


        .theme-buttons {

            margin-left: auto;

            display: flex;

            gap: 8px;
        }


        .theme-buttons button {

            padding: 8px 14px;

            border: none;

            border-radius: 6px;

            cursor: pointer;
        }


        .light-btn {

            background: white;

            color: black;
        }


        .dark-btn {

            background: #555;

            color: white;
        }


        /* FLASH MESSAGE */

        .flash-message {

            width: 90%;

            max-width: 650px;

            margin: 15px auto;

            padding: 12px;

            text-align: center;

            border-radius: 6px;

            background: #d4edda;

            color: #155724;
        }


        /* CONTAINER */

        .container {

            width: 90%;

            max-width: 650px;

            margin: 40px auto;
        }


        h1 {

            text-align: center;

            margin-bottom: 25px;
        }


        /* FORM CARD */

        .form-card {

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.15);
        }


        body.dark .form-card {

            background: #1e1e1e;

            color: white;
        }


        /* LABEL */

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;
        }


        .required {

            color: red;
        }


        /* INPUTS */

        input,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

            outline: none;
        }


        input:focus,
        select:focus {

            border-color: #007bff;
        }


        body.dark input,
        body.dark select {

            background: #2b2b2b;

            color: white;

            border: 1px solid #555;
        }


        body.dark select option {

            background: #2b2b2b;

            color: white;
        }


        /* SHOW INFORMATION */

        .show-info {

            margin-top: 10px;

            padding: 12px;

            background: #f1f3f5;

            border-radius: 6px;

            font-size: 14px;

            display: none;
        }


        body.dark .show-info {

            background: #2b2b2b;
        }


        /* BUTTONS */

        .button-group {

            margin-top: 25px;

            display: flex;

            gap: 10px;
        }


        .submit-btn {

            flex: 1;

            background: #28a745;

            color: white;

            border: none;

            padding: 12px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
        }


        .submit-btn:hover {

            background: #218838;
        }


        .cancel-btn {

            flex: 1;

            background: #6c757d;

            color: white;

            text-decoration: none;

            text-align: center;

            padding: 12px;

            border-radius: 6px;
        }


        .cancel-btn:hover {

            background: #5a6268;
        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <a href="{{ url_for('home') }}">
            Home
        </a>


        <a href="{{ url_for('movies') }}">
            Movies
        </a>


        <a href="{{ url_for('theaters') }}">
            Theaters
        </a>


        <a href="{{ url_for('shows') }}">
            Shows
        </a>


        <a href="{{ url_for('bookings') }}">
            Bookings
        </a>


        <a href="{{ url_for('logout') }}">
            Logout
        </a>


        <div class="theme-buttons">

            <button
                type="button"
                class="light-btn"
                onclick="setLight()">

                Light

            </button>


            <button
                type="button"
                class="dark-btn"
                onclick="setDark()">

                Dark

            </button>

        </div>

    </nav>


    <!-- FLASH -->

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="flash-message">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- MAIN -->

    <div class="container">

        <h1>
            Add Booking
        </h1>


        <div class="form-card">


            <form
                method="POST"
                action="{{ url_for('add_booking') }}">


                <!-- SHOW / MOVIE -->

                <label for="show_id">

                    Movie / Show

                    <span class="required">*</span>

                </label>


                <select
                    id="show_id"
                    name="show_id"
                    required
                    onchange="showDetails()">


                    <option value="">

                        Select Movie / Show

                    </option>


                    {% for show in shows %}

                        <option
                            value="{{ show['show_id'] }}"
                            data-movie="{{ show['movie_name'] or 'Movie Not Found' }}"
                            data-theater="{{ show['theater_name'] or 'Theater Not Found' }}"
                            data-location="{{ show['theater_location'] or '-' }}"
                            data-date="{{ show['show_date'] }}"
                            data-time="{{ show['show_time'] }}"
                            data-seats="{{ show['total_seats'] or 0 }}"
                        >

                            {{ show['movie_name'] or 'Movie Not Found' }}

                            -

                            {{ show['theater_name'] or 'Theater Not Found' }}

                            -

                            {{ show['show_date'] }}

                            -

                            {{ show['show_time'] }}

                        </option>

                    {% endfor %}


                </select>


                <!-- SHOW DETAILS -->

                <div
                    id="showInfo"
                    class="show-info">

                    <strong>Movie:</strong>
                    <span id="movieName">-</span>

                    <br><br>

                    <strong>Theater:</strong>
                    <span id="theaterName">-</span>

                    <br><br>

                    <strong>Location:</strong>
                    <span id="location">-</span>

                    <br><br>

                    <strong>Date:</strong>
                    <span id="showDate">-</span>

                    <br><br>

                    <strong>Time:</strong>
                    <span id="showTime">-</span>

                    <br><br>

                    <strong>Total Seats:</strong>
                    <span id="totalSeats">0</span>

                </div>


                <!-- CUSTOMER NAME -->

                <label for="customer_name">

                    Customer Name

                    <span class="required">*</span>

                </label>


                <input
                    type="text"
                    id="customer_name"
                    name="customer_name"
                    placeholder="Enter customer name"
                    required>


                <!-- SEATS -->

                <label for="seats_booked">

                    Seats Booked

                    <span class="required">*</span>

                </label>


                <input
                    type="number"
                    id="seats_booked"
                    name="seats_booked"
                    min="1"
                    placeholder="Enter number of seats"
                    required>


                <!-- BUTTONS -->

                <div class="button-group">


                    <button
                        type="submit"
                        class="submit-btn">

                        Add Booking

                    </button>


                    <a
                        href="{{ url_for('bookings') }}"
                        class="cancel-btn">

                        Cancel

                    </a>


                </div>


            </form>


        </div>

    </div>


    <script>


        /* LIGHT */

        function setLight() {

            document.body.classList.remove("dark");

            localStorage.setItem(
                "theme",
                "light"
            );

        }


        /* DARK */

        function setDark() {

            document.body.classList.add("dark");

            localStorage.setItem(
                "theme",
                "dark"
            );

        }


        /* SHOW DETAILS */

        function showDetails() {


            const select =
                document.getElementById("show_id");


            const selectedOption =
                select.options[
                    select.selectedIndex
                ];


            const info =
                document.getElementById("showInfo");


            if (!selectedOption.value) {

                info.style.display = "none";

                return;
            }


            document.getElementById(
                "movieName"
            ).textContent =
                selectedOption.dataset.movie;


            document.getElementById(
                "theaterName"
            ).textContent =
                selectedOption.dataset.theater;


            document.getElementById(
                "location"
            ).textContent =
                selectedOption.dataset.location;


            document.getElementById(
                "showDate"
            ).textContent =
                selectedOption.dataset.date;


            document.getElementById(
                "showTime"
            ).textContent =
                selectedOption.dataset.time;


            document.getElementById(
                "totalSeats"
            ).textContent =
                selectedOption.dataset.seats;


            info.style.display = "block";

        }


        /* LOAD THEME */

        window.onload = function () {


            const theme =
                localStorage.getItem("theme");


            if (theme === "dark") {

                document.body.classList.add("dark");

            }


            /* HIDE FLASH MESSAGE */

            setTimeout(function () {


                const messages =
                    document.querySelectorAll(
                        ".flash-message"
                    );


                messages.forEach(
                    function(message) {


                        message.style.transition =
                            "opacity 0.5s";


                        message.style.opacity =
                            "0";


                        setTimeout(
                            function() {

                                message.remove();

                            },
                            500
                        );


                    }
                );


            }, 3000);

        };

    </script>


</body>

</html>
